[project]
name = "h5n1-risk-australia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Meryl Theng", email = "meryltheng@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "rioxarray>=0.23.0",
    "scipy>=1.18.1",
    "snakemake>=9.27.0",
]

[project.scripts]
h5n1-risk-australia = "h5n1_risk_australia:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]

[tool.uv.build-backend]
module-name = "h5n1risk"
